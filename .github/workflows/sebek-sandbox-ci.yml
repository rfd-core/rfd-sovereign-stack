name: SEBEK Sandbox Verification Suite

on:
  push:
    branches: [ "dev" ]

jobs:
  sandbox-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Add any packages SEBEK's modules require here
          pip install pytest requests beautifulsoup4 playwright
          playwright install chromium

      - name: Run Modular Tests
        run: |
          # This command ensures all Python files compile without syntax errors
          python -m py_compile *.py
